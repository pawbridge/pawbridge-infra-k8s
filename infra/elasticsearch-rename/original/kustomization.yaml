apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - elasticsearch.yaml
secretGenerator:
  - name: store-search-file-realm-roles
    namespace: databases
    files:
      - roles.yml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: store-search
    app.kubernetes.io/instance: pawbridge
    app.kubernetes.io/component: search-authz
    app.kubernetes.io/part-of: pawbridge
