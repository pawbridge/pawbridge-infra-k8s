# Strimzi Kafka Cluster CR (Custom Resource)
# Strimzi Operator 설치 후 적용

---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: pawbridge
  namespace: kafka
spec:
  kafka:
    version: 3.5.1
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      auto.create.topics.enable: "true"
      log.retention.hours: 168
    storage:
      type: persistent-claim
      size: 3Gi
      class: local-path
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  zookeeper:
    replicas: 1
    storage:
      type: persistent-claim
      size: 3Gi
      class: local-path
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  entityOperator:
    topicOperator: {}
    userOperator: {}

# Debezium Kafka Connect는 별도 파일(debezium-connect.yaml)로 분리
# Strimzi KafkaConnect CR과 Debezium 이미지 호환성 이슈로 인해
# 직접 Deployment로 배포

