apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
      - name: debezium-connect
        image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8083
          name: connect-api
        env:
        - name: CONNECT_BOOTSTRAP_SERVERS
          value: {{ .Values.kafka.bootstrapServers | quote }}
        - name: CONNECT_REST_ADVERTISED_HOST_NAME
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CONNECT_REST_PORT
          value: "8083"
        - name: CONNECT_GROUP_ID
          value: {{ .Values.connect.groupId | quote }}
        - name: CONNECT_CONFIG_STORAGE_TOPIC
          value: {{ .Values.connect.configStorageTopic | quote }}
        - name: CONNECT_OFFSET_STORAGE_TOPIC
          value: {{ .Values.connect.offsetStorageTopic | quote }}
        - name: CONNECT_STATUS_STORAGE_TOPIC
          value: {{ .Values.connect.statusStorageTopic | quote }}
        - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
          value: {{ .Values.connect.replicationFactor | quote }}
        - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
          value: {{ .Values.connect.replicationFactor | quote }}
        - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
          value: {{ .Values.connect.replicationFactor | quote }}
        - name: CONNECT_KEY_CONVERTER
          value: {{ .Values.converter.key | quote }}
        - name: CONNECT_VALUE_CONVERTER
          value: {{ .Values.converter.value | quote }}
        - name: CONNECT_INTERNAL_KEY_CONVERTER
          value: "org.apache.kafka.connect.json.JsonConverter"
        - name: CONNECT_INTERNAL_VALUE_CONVERTER
          value: "org.apache.kafka.connect.json.JsonConverter"
        - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
          value: {{ .Values.converter.schemasEnable | quote }}
        - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
          value: {{ .Values.converter.schemasEnable | quote }}
        - name: CONNECT_PLUGIN_PATH
          value: "/usr/share/java,/usr/share/confluent-hub-components"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
        livenessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
