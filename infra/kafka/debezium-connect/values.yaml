# Debezium Kafka Connect Helm values
# 공식 이미지: quay.io/debezium/connect

image:
  repository: dorosiya/pawbridge-debezium-connect
  tag: "confluent-7.5.0"
  # 라이브 검증 이미지. 새 이미지를 빌드할 때 플러그인 버전 검증 후 함께 갱신한다.
  digest: "sha256:42f271d62d16bcf861cfdb2e506fe89c573a6ca31b79ccedca64f661e1ef6601"
  pullPolicy: Always  # Docker Hub에서 자동 Pull

replicaCount: 1

# Kafka 연결 설정
kafka:
  bootstrapServers: "pawbridge-kafka-bootstrap:9092"

# Kafka Connect 설정
connect:
  groupId: "pawbridge-connect"
  configStorageTopic: "connect-configs"
  offsetStorageTopic: "connect-offsets"
  statusStorageTopic: "connect-status"
  replicationFactor: 1

# Converter 설정
converter:
  key: "org.apache.kafka.connect.json.JsonConverter"
  value: "org.apache.kafka.connect.json.JsonConverter"
  schemasEnable: false

# Service 설정
service:
  type: ClusterIP
  port: 8083

# 리소스 제한
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2560Mi  # Confluent JVM -Xmx2G 요구사항 + 여유 (2.5GB)

# Probe 설정
probes:
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 10
