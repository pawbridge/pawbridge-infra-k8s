# Prometheus + Grafana (kube-prometheus-stack) values
# 공식 차트: prometheus-community/kube-prometheus-stack

# Grafana 설정
grafana:
  enabled: true
  image:
    tag: "11.4.0"
  # adminPassword: admin123 (Removed for security)
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password
  
  # NodePort로 외부 접근 (호스트 PC에서 VM_IP:30090)
  service:
    type: NodePort
    nodePort: 30090

  # 대시보드/데이터소스 영구 저장
  persistence:
    enabled: true
    size: 2Gi

  # PVC 권한 문제 방지
  initChownData:
    enabled: false

  # Ingress 비활성화 (NodePort로 대체)
  ingress:
    enabled: false
  
  # 리소스 제한
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Prometheus 설정
prometheus:
  service:
    type: NodePort
    nodePort: 30909
  prometheusSpec:
    # 모든 ServiceMonitor 수집
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # k6 메트릭 수신을 위한 remote write receiver 활성화
    enableRemoteWriteReceiver: true
    
    # 리소스 제한
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    
    # 데이터 보관 기간
    retention: 7d
    
    # 스토리지 (로컬 환경이므로 emptyDir)
    storageSpec: {}

# Alertmanager 설정
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Node Exporter 설정
nodeExporter:
  enabled: true

# Kube State Metrics 설정
kubeStateMetrics:
  enabled: true
