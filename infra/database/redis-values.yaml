# Redis Helm values
# 공식 차트: bitnami/redis
# 참고: Bitnami 2025.08 정책 변경으로 docker.io/bitnami 이미지 삭제됨
# bitnamilegacy 레포지토리 사용 (업데이트 없음, 개발용)

image:
  registry: docker.io
  repository: bitnamilegacy/redis
  tag: "7.0"
  pullPolicy: IfNotPresent

# 인증 비활성화 (로컬 개발 환경)
auth:
  enabled: false

# 단일 노드 모드
architecture: standalone

# Redis 기본 설정 (모듈 로딩 없음 - bitnamilegacy 이미지 호환)
commonConfiguration: |-
  # Enable AOF persistence
  appendonly yes
  # Disable RDB persistence
  save ""
  # No modules (bitnamilegacy doesn't include redisearch)

master:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 1Gi
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Replica 비활성화 (로컬 환경)
replica:
  replicaCount: 0
