# Redis Helm values (Stable & Compatible)
# Chart: bitnami/redis 24.1.3
# Target K8s: 1.27

auth:
  enabled: false # local dev에서는 편의상 비활성화 (필요시 Secret 전환 가능)

replica:
  replicaCount: 0 # Standalone 모드

master:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 8Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
