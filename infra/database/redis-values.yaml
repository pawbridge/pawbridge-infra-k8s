# Redis Helm values
# 공식 차트: bitnami/redis
# 참고: Bitnami 2025.08 정책 변경으로 버전 태그 삭제됨
# 현재 사용 가능: latest 태그만

image:
  registry: docker.io
  repository: bitnami/redis
  tag: latest
  pullPolicy: Always

# 인증 비활성화 (로컬 개발 환경)
auth:
  enabled: false

# 단일 노드 모드
architecture: standalone

master:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 1Gi
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Replica 비활성화 (로컬 환경)
replica:
  replicaCount: 0
