# Elasticsearch Helm Values (Single Node)
# 공식 차트: elastic/elasticsearch

replicas: 1

# Single Node 설정 - 정석 클러스터 모드 (부트스트랩)
clusterInitialMasterNodes: ["elasticsearch-master-0"]
esJavaOpts: "-Xmx512m -Xms512m"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "1.5Gi"

# 데이터 영구 저장 (Local Path)
volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

# Service 설정
service:
  type: ClusterIP
  httpPort: 9200
  transportPort: 9300

# 보안 설정 (개발용이라 끔)
# Elasticsearch 8.x는 기본적으로 보안이 켜져있음
# Helm Chart 템플릿을 오버라이드해야 함
protocol: http
createCert: false

esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false

# Health Check (Single Node: Must allow YELLOW status)
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10

# Nori(analysis-nori)는 ES 시작 전에 설치해야 JVM에 로드됨.
# postStart는 메인 프로세스와 동시에 돌아가 플러그인만 생기고 로드 안 되는 상태가 된다(empty _cat/plugins).
extraVolumes: |
  - name: es-plugins
    emptyDir: {}

extraVolumeMounts: |
  - name: es-plugins
    mountPath: /usr/share/elasticsearch/plugins

extraInitContainers: |
  - name: install-analysis-nori
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    image: "{{ .Values.image }}:{{ .Values.imageTag }}"
    imagePullPolicy: "{{ .Values.imagePullPolicy }}"
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        if ! bin/elasticsearch-plugin list | grep -q analysis-nori; then
          bin/elasticsearch-plugin install --batch analysis-nori
        fi
    volumeMounts:
      - name: es-plugins
        mountPath: /usr/share/elasticsearch/plugins
