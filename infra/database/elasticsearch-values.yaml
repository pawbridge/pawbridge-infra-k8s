# Elasticsearch Helm Values (Single Node)
# 공식 차트: elastic/elasticsearch

replicas: 1

# Single Node 설정 - 정석 클러스터 모드 (부트스트랩)
clusterInitialMasterNodes: ["elasticsearch-master-0"]
esJavaOpts: "-Xmx1g -Xms1g"

resources:
  requests:
    cpu: "500m"
    memory: "1.5Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# 데이터 영구 저장 (Local Path)
volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

# Service 설정
service:
  type: ClusterIP
  httpPort: 9200
  transportPort: 9300

# 보안 설정 (개발용이라 끔)
# Elasticsearch 8.x는 기본적으로 보안이 켜져있음
# Helm Chart 템플릿을 오버라이드해야 함
protocol: http
createCert: false

esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.transport.ssl.enabled: false
    xpack.security.http.ssl.enabled: false

# Health Check (Single Node: Must allow YELLOW status)
clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10

lifecycle:
  postStart:
    exec:
      command:
        - bash
        - -c
        - |
          #!/bin/bash
          # ES 플러그인 설치 - Nori 한국어 형태소 분석기
          bin/elasticsearch-plugin install --batch analysis-nori
