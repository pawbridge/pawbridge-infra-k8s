# MySQL Helm values (Hardened & Secret-based)
# Chart: bitnami/mysql 14.0.3 (Verified)
# App Version: MySQL 8.0.37 (Forced Compatibility)

image:
  repository: "bitnamilegacy/mysql"
  tag: "8.0.37-debian-12-r2"

auth:
  # Password is now managed via Kubernetes Secret (Security Fix #1)
  existingSecret: "mysql-auth"
  database: "pawbridge"
  defaultAuthenticationPlugin: "mysql_native_password"

primary:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 10Gi

  # Network & Bind Settings (Security Fix #2: Standard for internal but open)
  extraFlags: "--bind-address=0.0.0.0"
  
  configuration: |-
    [client]
    socket=/opt/bitnami/mysql/tmp/mysql.sock

    [mysqld]
    socket=/opt/bitnami/mysql/tmp/mysql.sock
    bind-address=0.0.0.0
    skip-host-cache
    skip-name-resolve
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    log-bin=mysql-bin
    binlog-format=ROW
    binlog-row-image=FULL
    server-id=1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # VM 환경을 위한 Probe 시간 연장 (이미지 다운로드 및 DB 초기화 대기)
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30 # 약 5분(300초) 대기
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10

initdbScripts:
  init.sql: |
    -- Ensure root password is set to match the secret (Fix Access Denied)
    ALTER USER 'root'@'localhost' IDENTIFIED BY 'root123';
    
    -- Allow root access from anywhere (for debugging/external connections)
    CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'root123';
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;

    -- Create Application Databases
    CREATE DATABASE IF NOT EXISTS pawbridge_user;
    CREATE DATABASE IF NOT EXISTS pawbridge_animal;
    CREATE DATABASE IF NOT EXISTS pawbridge_community;
    CREATE DATABASE IF NOT EXISTS pawbridge_store;
    CREATE DATABASE IF NOT EXISTS pawbridge_payment;
