# MySQL Helm values
# 공식 차트: bitnami/mysql
# 참고: Bitnami 2025.08 정책 변경으로 docker.io/bitnami 이미지 삭제됨
# bitnamilegacy 레포지토리 사용 (업데이트 없음, 개발용)

image:
  registry: docker.io
  repository: bitnamilegacy/mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

auth:
  rootPassword: "root123"
  database: "pawbridge"

primary:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 10Gi

  # extraEnvVars: legacy 이미지가 MYSQL_ROOT_PASSWORD 환경변수를 인식하도록 직접 주입
  # 차트 14.x는 MYSQL_ROOT_PASSWORD_FILE 방식을 사용하지만 legacy 이미지와 호환 안 됨
  extraEnvVars:
    - name: MYSQL_ROOT_PASSWORD
      value: "root123"

  configuration: |-
    [mysqld]
    default_authentication_plugin=mysql_native_password
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    log-bin=mysql-bin
    binlog-format=ROW
    binlog-row-image=FULL
    server-id=1
    skip-host-cache
    skip-name-resolve

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # 기본 probe 비활성화 (customProbe 사용)
  startupProbe:
    enabled: false
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false

  # Custom Startup Probe
  # 비밀번호를 파일에서 읽음 (환경변수 ${MYSQL_ROOT_PASSWORD}가 없을 수 있으므로)
  customStartupProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - |
          mysqladmin ping -uroot -p"$(cat /opt/bitnami/mysql/secrets/mysql-root-password)" --socket=/opt/bitnami/mysql/tmp/mysql.sock
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 30  # 최대 8.5분 대기
    successThreshold: 1

  # Custom Liveness Probe
  customLivenessProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - |
          mysqladmin ping -uroot -p"$(cat /opt/bitnami/mysql/secrets/mysql-root-password)" --socket=/opt/bitnami/mysql/tmp/mysql.sock
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

  # Custom Readiness Probe
  customReadinessProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - |
          mysqladmin ping -uroot -p"$(cat /opt/bitnami/mysql/secrets/mysql-root-password)" --socket=/opt/bitnami/mysql/tmp/mysql.sock
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

# Init SQL (데이터베이스 생성)
initdbScripts:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS pawbridge_user;
    CREATE DATABASE IF NOT EXISTS pawbridge_animal;
    CREATE DATABASE IF NOT EXISTS pawbridge_community;
    CREATE DATABASE IF NOT EXISTS pawbridge_store;
    CREATE DATABASE IF NOT EXISTS pawbridge_payment;
