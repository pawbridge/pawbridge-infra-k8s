# MySQL Helm values
# 공식 차트: bitnami/mysql
# 참고: Bitnami 2025.08 정책 변경으로 docker.io/bitnami 이미지 삭제됨
# bitnamilegacy 레포지토리 사용 (업데이트 없음, 개발용)

image:
  registry: docker.io
  repository: bitnamilegacy/mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

auth:
  rootPassword: "root123"
  database: "pawbridge"

primary:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 10Gi
  
  configuration: |-
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    log-bin=mysql-bin
    binlog-format=ROW
    binlog-row-image=FULL
    server-id=1
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Startup probe 설정 (MySQL 시작 시간 충분히 확보)
  startupProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 30  # 60 + (15 * 30) = 최대 510초 = 8.5분 대기

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

# Init SQL (데이터베이스 생성)
initdbScripts:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS pawbridge_user;
    CREATE DATABASE IF NOT EXISTS pawbridge_animal;
    CREATE DATABASE IF NOT EXISTS pawbridge_community;
    CREATE DATABASE IF NOT EXISTS pawbridge_store;
    CREATE DATABASE IF NOT EXISTS pawbridge_payment;
