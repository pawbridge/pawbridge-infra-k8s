# MySQL Helm values (Hardened & Secret-based)
# Chart: bitnami/mysql 14.0.3 (Verified)
# App Version: MySQL 8.0.37 (Forced Compatibility)

image:
  repository: "bitnamilegacy/mysql"
  tag: "8.0.37-debian-12-r2"

auth:
  # Password is now managed via Kubernetes Secret (Security Fix #1)
  existingSecret: "mysql-auth"
  database: "pawbridge"
  defaultAuthenticationPlugin: "mysql_native_password"

primary:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: 10Gi

  # Network & Bind Settings (Security Fix #2: Standard for internal but open)
  # extraFlags removed to avoid duplication with configuration [mysqld] section
  
  configuration: |-
    [client]
    socket=/opt/bitnami/mysql/tmp/mysql.sock

    [mysqld]
    default_authentication_plugin=mysql_native_password
    socket=/opt/bitnami/mysql/tmp/mysql.sock
    bind-address=0.0.0.0
    skip-host-cache
    skip-name-resolve
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    log-bin=mysql-bin
    binlog-format=ROW
    binlog-row-image=FULL
    server-id=1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # VM 환경을 위한 Probe 시간 연장 및 소켓 경로 명시 (Fix: Socket Mismatch & Timeout)
  # Bitnami Chart 특성상 standard probe를 끄고 custom probe로 교체해야 exec가 반영됨
  startupProbe:
    enabled: false
  readinessProbe:
    enabled: false
  livenessProbe:
    enabled: false

  customStartupProbe:
    exec:
      command:
        - /bin/bash
        - -ec
        - |
          password_aux="${MYSQL_ROOT_PASSWORD:-}"
          if [[ -f "${MYSQL_ROOT_PASSWORD_FILE:-}" ]]; then
              password_aux=$(cat "$MYSQL_ROOT_PASSWORD_FILE")
          fi
          mysql --protocol=socket --socket=/opt/bitnami/mysql/tmp/mysql.sock -uroot -p"${password_aux}" -e "SELECT 1" >/dev/null 2>&1
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30

  customReadinessProbe:
    exec:
      command:
        - /bin/bash
        - -ec
        - |
          password_aux="${MYSQL_ROOT_PASSWORD:-}"
          if [[ -f "${MYSQL_ROOT_PASSWORD_FILE:-}" ]]; then
              password_aux=$(cat "$MYSQL_ROOT_PASSWORD_FILE")
          fi
          mysql --protocol=socket --socket=/opt/bitnami/mysql/tmp/mysql.sock -uroot -p"${password_aux}" -e "SELECT 1" >/dev/null 2>&1
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 10

  customLivenessProbe:
    exec:
      command:
        - /bin/bash
        - -ec
        - |
          password_aux="${MYSQL_ROOT_PASSWORD:-}"
          if [[ -f "${MYSQL_ROOT_PASSWORD_FILE:-}" ]]; then
              password_aux=$(cat "$MYSQL_ROOT_PASSWORD_FILE")
          fi
          mysql --protocol=socket --socket=/opt/bitnami/mysql/tmp/mysql.sock -uroot -p"${password_aux}" -e "SELECT 1" >/dev/null 2>&1
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 10

initdbScripts:
  init.sql: |
    -- Only create databases (Do not modify root user to avoid conflicts with PVC/Secrets)

    -- Create Application Databases
    CREATE DATABASE IF NOT EXISTS pawbridge_user;
    CREATE DATABASE IF NOT EXISTS pawbridge_animal;
    CREATE DATABASE IF NOT EXISTS pawbridge_community;
    CREATE DATABASE IF NOT EXISTS pawbridge_store;
    CREATE DATABASE IF NOT EXISTS pawbridge_payment;
