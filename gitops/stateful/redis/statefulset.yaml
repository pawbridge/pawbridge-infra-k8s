apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: databases
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: pawbridge
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: pawbridge
spec:
  serviceName: redis-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: pawbridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: pawbridge
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: pawbridge
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-acl
          image: redis:7.2.16-bookworm@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              case "${REDIS_PASSWORD}" in
                ""|*[!A-Za-z0-9_-]*)
                  echo "redis-password must contain only URL-safe characters" >&2
                  exit 1
                  ;;
              esac
              if [ "${#REDIS_PASSWORD}" -lt 32 ]; then
                echo "redis-password must be at least 32 characters" >&2
                exit 1
              fi
              umask 077
              printf 'user default on >%s ~* &* +@all\n' "${REDIS_PASSWORD}" > /run/redis-auth/users.acl
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime-auth
              mountPath: /run/redis-auth
            - name: tmp
              mountPath: /tmp
      containers:
        - name: redis
          image: redis:7.2.16-bookworm@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "yes"
            - --aclfile
            - /run/redis-auth/users.acl
            - --dir
            - /data
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --aof-use-rdb-preamble
            - "yes"
            - --save
            - "900 1"
            - --save
            - "300 10"
            - --save
            - "60 10000"
            - --maxmemory
            - 384mb
            - --maxmemory-policy
            - noeviction
            - --stop-writes-on-bgsave-error
            - "yes"
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - '[ "$(redis-cli --raw -h 127.0.0.1 ping)" = "PONG" ]'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - '[ "$(redis-cli --raw -h 127.0.0.1 ping)" = "PONG" ]'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - '[ "$(redis-cli --raw -h 127.0.0.1 ping)" = "PONG" ]'
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime-auth
              mountPath: /run/redis-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/instance: pawbridge
          app.kubernetes.io/component: cache
          app.kubernetes.io/part-of: pawbridge
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
