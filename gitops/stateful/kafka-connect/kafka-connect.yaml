apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: pawbridge-connect
  namespace: kafka
  labels:
    app.kubernetes.io/name: pawbridge-kafka-connect
    app.kubernetes.io/part-of: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.1.2
  image: docker.io/dorosiya/pawbridge-debezium-connect@sha256:cd51857d670c359d658e76ca86a097322daedff762311953193a7994b259f337
  replicas: 1
  bootstrapServers: pawbridge-kafka-bootstrap:9092
  groupId: pawbridge-connect
  configStorageTopic: connect-configs
  offsetStorageTopic: connect-offsets
  statusStorageTopic: connect-status
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  logging:
    type: inline
    loggers:
      rootLogger.level: INFO
  template:
    pod:
      metadata:
        annotations:
          pawbridge.kr/store-search-secret-epoch: "1"
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: store-search-trust
          secret:
            secretName: store-search-trust
            items:
              - key: ca.crt
                path: ca.crt
    connectContainer:
      volumeMounts:
        - name: store-search-trust
          mountPath: /mnt/store-search-trust
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
