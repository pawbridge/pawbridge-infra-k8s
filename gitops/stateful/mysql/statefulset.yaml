apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: databases
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: pawbridge
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: pawbridge
spec:
  serviceName: mysql-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: pawbridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: pawbridge
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: pawbridge
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 27
        runAsGroup: 27
        fsGroup: 27
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: container-registry.oracle.com/mysql/community-server:8.4.12@sha256:7dcc4add9183664de3a214daf85a50c3ba6cccfd7534f700b6561bf5b41885be
          imagePullPolicy: IfNotPresent
          args:
            - --bind-address=0.0.0.0
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
            - --server-id=13601
            - --log-bin=mysql-bin
            - --binlog-format=ROW
            - --binlog-row-image=FULL
            - --binlog-expire-logs-seconds=604800
            - --innodb-buffer-pool-size=512M
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: mysql-root-password
            - name: MYSQL_ROOT_HOST
              value: "%"
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          startupProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --host=127.0.0.1
                - --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --host=127.0.0.1
                - --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --host=127.0.0.1
                - --silent
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: mysql
          app.kubernetes.io/instance: pawbridge
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: pawbridge
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
