apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pawbridge-postgresql
  namespace: databases
  labels: &id001
    app.kubernetes.io/name: pawbridge-postgresql
    app.kubernetes.io/instance: pawbridge
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: pawbridge
spec:
  serviceName: pawbridge-postgresql-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: pawbridge-postgresql
      app.kubernetes.io/instance: pawbridge
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/hostname: pawbridge-k136-w1
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgresql
        image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        imagePullPolicy: IfNotPresent
        args:
        - postgres
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        env:
        - name: POSTGRES_DB
          value: pawbridge
        - name: POSTGRES_USER
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/postgresql/postgres-password
        - name: POSTGRES_INITDB_ARGS
          value: --auth-host=scram-sha-256 --auth-local=peer
        ports:
        - name: postgresql
          containerPort: 5432
        startupProbe:
          exec: &id002
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -p
            - '5432'
            - -U
            - postgres
            - -d
            - pawbridge
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec: *id002
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec: *id002
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 500m
            memory: 1536Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /etc/postgresql
          readOnly: true
        - name: auth
          mountPath: /run/secrets/postgresql
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: config
        configMap:
          name: pawbridge-postgresql-config
      - name: auth
        secret:
          secretName: pawbridge-postgresql-admin-auth
          defaultMode: 288
          items:
          - key: postgres-password
            path: postgres-password
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
  volumeClaimTemplates:
  - metadata:
      name: data
      labels: *id001
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi
