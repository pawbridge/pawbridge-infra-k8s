apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: animal-outbox-connector
  namespace: kafka
  labels:
    strimzi.io/cluster: pawbridge-connect
    app.kubernetes.io/name: animal-outbox-connector
    app.kubernetes.io/part-of: pawbridge
spec:
  class: io.debezium.connector.mysql.MySqlConnector
  tasksMax: 1
  state: running
  config:
    database.hostname: mysql.databases.svc.cluster.local
    database.port: 3306
    database.user: '${secrets:kafka/store-mysql-cdc-auth:username}'
    database.password: '${secrets:kafka/store-mysql-cdc-auth:password}'
    database.connectionTimeZone: Asia/Seoul
    database.server.id: 2002
    topic.prefix: pawbridge-animal
    snapshot.mode: no_data
    database.include.list: pawbridge_animal
    table.include.list: pawbridge_animal.outbox_events
    schema.history.internal.kafka.bootstrap.servers: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092
    schema.history.internal.kafka.topic: schema-changes.animal.outbox
    transforms: outbox
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.id: event_id
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.timestamp: created_at
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.table.fields.additional.placement: event_type:header:eventType
    transforms.outbox.route.topic.replacement: '${routedByValue}'
    transforms.outbox.route.by.field: topic
    transforms.outbox.table.expand.json.payload: true
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
