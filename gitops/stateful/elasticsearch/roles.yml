pawbridge_store_reader:
  cluster: []
  indices:
    - names:
        - store-products-read
      privileges:
        - read
        - view_index_metadata

pawbridge_store_writer:
  cluster:
    - monitor
  indices:
    - names:
        - store-products-write
      privileges:
        - read
        - write
        - view_index_metadata

pawbridge_store_bootstrap:
  cluster:
    - monitor
  indices:
    - names:
        - store-products-*
      privileges:
        - create_index
        - manage
        - read
        - view_index_metadata

pawbridge_community_writer:
  cluster: []
  indices:
    - names:
        - posts
      privileges:
        - create_index
        - manage
        - read
        - write
        - view_index_metadata

pawbridge_animal_writer:
  cluster: []
  indices:
    - names:
        - animals
      privileges:
        - read
        - write
        - view_index_metadata

pawbridge_python_writer:
  cluster: []
  indices:
    - names:
        - animals
      privileges:
        - read
        - write
        - view_index_metadata

pawbridge_animal_bootstrap:
  cluster:
    - monitor
  indices:
    - names:
        - animals
        - animals-recovered-v001
      privileges:
        - manage
        - read
        - view_index_metadata
