apiVersion: batch/v1
kind: Job
metadata:
  name: store-search-index-v001
  namespace: databases
  labels:
    app.kubernetes.io/name: store-search-index-v001
    app.kubernetes.io/instance: pawbridge
    app.kubernetes.io/component: search-bootstrap
    app.kubernetes.io/part-of: pawbridge
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-search-index-v001
        app.kubernetes.io/instance: pawbridge
        app.kubernetes.io/component: search-bootstrap
        app.kubernetes.io/part-of: pawbridge
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-index
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5@sha256:8870d5b7b86235fa790c9112464f5fd3b693f89d73e757a630f8b5cda350f95b
          imagePullPolicy: IfNotPresent
          env:
            - name: ES_URL
              value: https://store-search-es-http.databases.svc:9200
            - name: ES_HOST
              value: store-search-es-http.databases.svc
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: store-search-bootstrap-auth
                  key: username
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-search-bootstrap-auth
                  key: password
            - name: INDEX_NAME
              value: store-products-v001
            - name: WRITE_ALIAS
              value: store-products-write
          command:
            - sh
            - -ec
          args:
            - |
              umask 077
              NETRC=/tmp/store-search.netrc
              INDEX_BODY=/tmp/store-index-v001.json
              RESPONSE=/tmp/response.json
              cleanup() {
                rm -f "${NETRC}" "${INDEX_BODY}" "${RESPONSE}"
              }
              trap cleanup EXIT

              printf 'machine %s login %s password %s\n' \
                "${ES_HOST}" "${ES_USERNAME}" "${ES_PASSWORD}" > "${NETRC}"
              unset ES_USERNAME ES_PASSWORD

              attempt=0
              until curl --silent --show-error --fail \
                --cacert /etc/store-search-ca/ca.crt \
                --netrc-file "${NETRC}" \
                "${ES_URL}/" \
                --output "${RESPONSE}"; do
                attempt=$((attempt + 1))
                if [ "${attempt}" -ge 24 ]; then
                  echo "Elasticsearch did not become reachable with the bootstrap account" >&2
                  exit 1
                fi
                sleep 5
              done

              index_status="$(curl --silent --show-error \
                --cacert /etc/store-search-ca/ca.crt \
                --netrc-file "${NETRC}" \
                --output /dev/null --write-out '%{http_code}' \
                --head "${ES_URL}/${INDEX_NAME}")"
              alias_status="$(curl --silent --show-error \
                --cacert /etc/store-search-ca/ca.crt \
                --netrc-file "${NETRC}" \
                --output /dev/null --write-out '%{http_code}' \
                --head "${ES_URL}/_alias/${WRITE_ALIAS}")"
              [ "${index_status}" = 404 ] || {
                echo "Refusing to replace existing index ${INDEX_NAME}: HTTP ${index_status}" >&2
                exit 1
              }
              [ "${alias_status}" = 404 ] || {
                echo "Refusing to replace existing alias ${WRITE_ALIAS}: HTTP ${alias_status}" >&2
                exit 1
              }

              sed '$d' /etc/store-index/store-index-mapping.json > "${INDEX_BODY}"
              printf ',\n  "aliases": {\n    "%s": {"is_write_index": true}\n  }\n}\n' \
                "${WRITE_ALIAS}" >> "${INDEX_BODY}"

              curl --silent --show-error --fail-with-body \
                --cacert /etc/store-search-ca/ca.crt \
                --netrc-file "${NETRC}" \
                --header 'Content-Type: application/json' \
                --request PUT "${ES_URL}/${INDEX_NAME}" \
                --data-binary "@${INDEX_BODY}" \
                --output "${RESPONSE}"
              grep -Fq '"acknowledged":true' "${RESPONSE}"

              curl --silent --show-error --fail \
                --cacert /etc/store-search-ca/ca.crt \
                --netrc-file "${NETRC}" \
                "${ES_URL}/${INDEX_NAME}/_mapping" \
                --output "${RESPONSE}"
              grep -Fq '"dynamic":"strict"' "${RESPONSE}"
              grep -Fq '"contract":"store-products-v1"' "${RESPONSE}"

              curl --silent --show-error --fail \
                --cacert /etc/store-search-ca/ca.crt \
                --netrc-file "${NETRC}" \
                "${ES_URL}/_alias/${WRITE_ALIAS}" \
                --output "${RESPONSE}"
              compact_alias="$(tr -d '[:space:]' < "${RESPONSE}")"
              expected_alias="{\"${INDEX_NAME}\":{\"aliases\":{\"${WRITE_ALIAS}\":{\"is_write_index\":true}}}}"
              [ "${compact_alias}" = "${expected_alias}" ] || {
                echo "Write alias does not point exclusively to ${INDEX_NAME}" >&2
                exit 1
              }
              echo "Created ${INDEX_NAME} and ${WRITE_ALIAS}; read alias is intentionally not created."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mapping
              mountPath: /etc/store-index
              readOnly: true
            - name: ca
              mountPath: /etc/store-search-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: mapping
          configMap:
            name: store-search-index-v001-mapping
        - name: ca
          secret:
            secretName: store-search-es-http-certs-public
            items:
              - key: ca.crt
                path: ca.crt
