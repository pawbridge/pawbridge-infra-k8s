# Loki has no built-in authentication. Only collectors, Grafana and metrics may enter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-logs
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [pawbridge-loki, pawbridge-alloy]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [pawbridge-alloy, grafana, prometheus]
      ports:
        - {protocol: TCP, port: 3100}
        - {protocol: TCP, port: 12345}
