apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-redis-pilot
  namespace: argocd
  labels:
    app.kubernetes.io/name: pawbridge-redis-pilot
    app.kubernetes.io/part-of: pawbridge
spec:
  description: PawBridge Redis manual-sync GitOps pilot
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: databases
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: apps
      kind: StatefulSet
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
