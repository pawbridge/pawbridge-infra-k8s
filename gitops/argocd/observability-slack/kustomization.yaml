apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../observability
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: observability-baseline
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/observability/slack-values.yaml
