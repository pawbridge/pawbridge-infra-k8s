apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-zipkin-pilot
  namespace: argocd
spec:
  description: Internal-only Zipkin manual-sync pilot
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: tracing
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
