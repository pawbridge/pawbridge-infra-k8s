apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-eck-operator-pilot
  namespace: argocd
spec:
  description: ECK 3.5.0 namespace-restricted manual-sync installation pilot
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
    - https://helm.elastic.co
  destinations:
    - server: https://kubernetes.default.svc
      namespace: elastic-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: StatefulSet
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  orphanedResources:
    warn: true
