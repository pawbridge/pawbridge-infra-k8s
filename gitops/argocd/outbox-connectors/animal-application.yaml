apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: animal-outbox-source
  namespace: argocd
spec:
  project: pawbridge-outbox-connectors
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: dev
    path: gitops/stateful/animal-outbox-source
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    syncOptions:
      - Prune=false
      - FailOnSharedResource=true
