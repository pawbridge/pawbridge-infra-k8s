apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: community-search-runtime-vso
  namespace: argocd
spec:
  project: pawbridge-community-search-vso
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: dev
    path: gitops/security/community-search-vso/runtime
  destination:
    server: https://kubernetes.default.svc
    namespace: pawbridge
  syncPolicy:
    syncOptions:
      - Prune=false
      - FailOnSharedResource=true
