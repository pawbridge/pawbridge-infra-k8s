apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-ai-service-dev
  namespace: argocd
spec:
  project: pawbridge-production
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: main
    path: charts/python-ai-service
    helm:
      releaseName: python-ai-service
      valueFiles:
      - ../../environments/prod/values/python-ai-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pawbridge
  syncPolicy:
    syncOptions:
    - Prune=false
    - FailOnSharedResource=true
