apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lost-search-gpu-proxy-dev
  namespace: argocd
spec:
  project: pawbridge-production
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: main
    path: charts/lost-search-gpu-proxy
    helm:
      releaseName: lost-search-gpu-proxy
      valueFiles:
      - ../../environments/prod/values/lost-search-gpu-proxy.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pawbridge
  syncPolicy:
    syncOptions:
    - Prune=false
    - FailOnSharedResource=true
