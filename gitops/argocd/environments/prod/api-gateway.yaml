apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway-dev
  namespace: argocd
spec:
  project: pawbridge-production
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: main
    path: charts/api-gateway
    helm:
      releaseName: api-gateway
      valueFiles:
      - ../../environments/prod/values/api-gateway.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pawbridge
  syncPolicy:
    syncOptions:
    - Prune=false
    - FailOnSharedResource=true
