apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: photo-service-test
  namespace: argocd
spec:
  project: pawbridge-dev
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: dev
    path: charts/photo-service
    helm:
      releaseName: photo-service
      valueFiles:
      - ../../environments/dev/isolated-values/photo-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pawbridge-dev
  syncPolicy:
    syncOptions:
    - Prune=false
    - FailOnSharedResource=true
