apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lost-search-gpu-proxy-test
  namespace: argocd
spec:
  project: pawbridge-dev
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: dev
    path: charts/lost-search-gpu-proxy
    helm:
      releaseName: lost-search-gpu-proxy
      valueFiles:
      - ../../environments/dev/isolated-values/lost-search-gpu-proxy.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pawbridge-dev
  syncPolicy:
    syncOptions:
    - Prune=false
    - FailOnSharedResource=true
