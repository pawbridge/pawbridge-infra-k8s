apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-store-search-connectors
  namespace: argocd
spec:
  description: Separately gated Store Elasticsearch sink and MySQL outbox source applications
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kafka
  namespaceResourceWhitelist:
    - group: kafka.strimzi.io
      kind: KafkaConnector
  orphanedResources:
    warn: true
