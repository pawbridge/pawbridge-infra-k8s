apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-store-search-index
  namespace: argocd
spec:
  description: Immutable Store search index bootstrap manual-sync application
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: databases
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: batch
      kind: Job
  orphanedResources:
    warn: true
