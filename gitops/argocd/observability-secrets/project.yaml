apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-observability-secrets
  namespace: argocd
spec:
  description: Manual monitoring-only Grafana and optional Slack secret sync
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: secrets.hashicorp.com
      kind: VaultConnection
    - group: secrets.hashicorp.com
      kind: VaultAuth
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
