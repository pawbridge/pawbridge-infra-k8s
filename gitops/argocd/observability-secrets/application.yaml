apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-grafana-vso
  namespace: argocd
spec:
  project: pawbridge-observability-secrets
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: dev
    path: gitops/security/observability-vso
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - Prune=false
      - FailOnSharedResource=true
