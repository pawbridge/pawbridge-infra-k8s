apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-strimzi-operator-pilot
  namespace: argocd
spec:
  description: Strimzi 1.0.1 single-namespace manual-sync installation pilot
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
    - https://strimzi.io/charts/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kafka
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
