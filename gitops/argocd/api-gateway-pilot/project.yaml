apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-api-gateway-pilot
  namespace: argocd
spec:
  description: API Gateway manual-sync pilot without NodePort or Kubernetes Ingress
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: pawbridge
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
