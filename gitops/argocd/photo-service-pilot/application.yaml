apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: photo-service-dev
  namespace: argocd
spec:
  project: pawbridge-photo-service-pilot
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: dev
    path: charts/photo-service
    helm:
      releaseName: photo-service
      valueFiles:
        - ../../environments/dev/values/photo-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pawbridge
  # Deliberately no automated sync or registration in an existing root app.
  syncPolicy:
    syncOptions:
      - Prune=false
      - FailOnSharedResource=true
