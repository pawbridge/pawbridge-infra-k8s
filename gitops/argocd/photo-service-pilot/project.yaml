apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-photo-service-pilot
  namespace: argocd
spec:
  description: Internal photo optimizer manual-sync pilot
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: pawbridge
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
