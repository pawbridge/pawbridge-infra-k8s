apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-store-search-read-cutover
  namespace: argocd
spec:
  description: Non-empty Store search read alias promotion manual-sync gate
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: databases
  namespaceResourceWhitelist:
    - group: batch
      kind: Job
  orphanedResources:
    warn: true
