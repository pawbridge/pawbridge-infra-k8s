apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-vault-baseline-pilot
  namespace: argocd
spec:
  description: Vault TLS and single-node Raft manual-sync baseline pilot
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
    - https://helm.releases.hashicorp.com
  destinations:
    - server: https://kubernetes.default.svc
      namespace: vault
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: StatefulSet
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
