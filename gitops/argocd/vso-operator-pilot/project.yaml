apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-vso-operator-pilot
  namespace: argocd
spec:
  description: Vault Secrets Operator 1.4.1 manual-sync installation pilot
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
    - https://helm.releases.hashicorp.com
  destinations:
    - server: https://kubernetes.default.svc
      namespace: vault-secrets-operator-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
