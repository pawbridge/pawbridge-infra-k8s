apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pawbridge-cloudflared-pilot
  namespace: argocd
spec:
  description: Cloudflare Tunnel connector manual-sync pilot
  sourceRepos:
    - https://github.com/pawbridge/pawbridge-infra-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: pawbridge
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
