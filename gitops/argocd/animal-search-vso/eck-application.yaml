apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: animal-search-eck-auth-vso
  namespace: argocd
spec:
  project: pawbridge-animal-search-vso
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: dev
    path: gitops/security/animal-search-vso/eck
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    syncOptions:
      - Prune=false
      - FailOnSharedResource=true
