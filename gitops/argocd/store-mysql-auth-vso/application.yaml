apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: store-mysql-auth-vso
  namespace: argocd
spec:
  project: pawbridge-store-mysql-auth-vso
  source:
    repoURL: https://github.com/pawbridge/pawbridge-infra-k8s.git
    targetRevision: dev
    path: gitops/security/store-mysql-auth-vso
  destination:
    server: https://kubernetes.default.svc
    namespace: pawbridge
  syncPolicy:
    syncOptions:
      - Prune=false
      - FailOnSharedResource=true
