apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: user-runtime-vault-auth
  namespace: pawbridge
spec:
  vaultConnectionRef: user-runtime-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: user-runtime-read
    serviceAccount: user-runtime-vault-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
