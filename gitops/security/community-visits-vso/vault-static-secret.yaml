apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: community-visits
  namespace: pawbridge
spec:
  vaultAuthRef: community-visits-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/prod/community/visits
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: community-service
  destination:
    create: true
    overwrite: false
    name: community-visits-auth
    transformation:
      excludeRaw: true
      includes: ['^DAILY_VISITORS_SIGNING_KEY$']
