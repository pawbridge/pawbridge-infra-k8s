apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-admin-vault-auth
  namespace: databases
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: postgresql-admin-vault-connection
  namespace: databases
spec:
  address: https://vault.vault.svc.cluster.local:8200
  caCertSecretRef: vault-internal-ca
  skipTLSVerify: false
  tlsServerName: vault.vault.svc.cluster.local
  timeout: 10s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: postgresql-admin-vault-auth
  namespace: databases
spec:
  vaultConnectionRef: postgresql-admin-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: postgresql-admin-read
    serviceAccount: postgresql-admin-vault-auth
    audiences:
    - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pawbridge-postgresql-admin-auth
  namespace: databases
spec:
  vaultAuthRef: postgresql-admin-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/postgresql/admin
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: pawbridge-postgresql-admin-auth
    transformation:
      excludeRaw: true
      includes:
      - ^postgres-password$
