apiVersion: v1
kind: ServiceAccount
metadata:
  name: animal-runtime-vault-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: animal-runtime-vault-connection
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  address: https://vault.vault.svc.cluster.local:8200
  caCertSecretRef: vault-internal-ca
  skipTLSVerify: false
  tlsServerName: vault.vault.svc.cluster.local
  timeout: 10s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: animal-runtime-vault-auth
  namespace: pawbridge
spec:
  vaultConnectionRef: animal-runtime-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: animal-runtime-read
    serviceAccount: animal-runtime-vault-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: animal-mysql-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: animal-runtime-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/animal/mysql
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: animal-service
  destination:
    create: true
    overwrite: false
    name: animal-mysql-auth
    transformation:
      excludeRaw: true
      includes:
        - ^mysql-password$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: animal-runtime-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: animal-runtime-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/animal/runtime
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: animal-service
  destination:
    create: true
    overwrite: false
    name: animal-runtime-auth
    transformation:
      excludeRaw: true
      includes:
        - ^APMS_API_BASE_URL$
        - ^APMS_API_SERVICE_KEY$
        - ^CHATBOT_IP_HASH_SECRET$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: animal-r2-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: animal-runtime-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/store/r2
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: animal-service
  destination:
    create: true
    overwrite: false
    name: animal-r2-auth
    transformation:
      excludeRaw: true
      includes:
        - ^R2_ACCESS_KEY_ID$
        - ^R2_SECRET_ACCESS_KEY$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: animal-python-internal-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: animal-runtime-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/animal-python/internal
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: animal-service
  destination:
    create: true
    overwrite: false
    name: animal-python-internal-auth
    transformation:
      excludeRaw: true
      includes:
        - ^INTERNAL_API_KEY$
