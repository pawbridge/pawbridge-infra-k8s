apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: community-r2-vault-auth
  namespace: pawbridge
spec:
  vaultConnectionRef: community-r2-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: community-r2-read
    serviceAccount: community-r2-vault-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
