apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: community-youtube-vault-connection
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  address: https://vault.vault.svc.cluster.local:8200
  # Reuse the current public CA Secret; never bypass TLS verification.
  caCertSecretRef: vault-internal-ca
  skipTLSVerify: false
  tlsServerName: vault.vault.svc.cluster.local
  timeout: 10s
