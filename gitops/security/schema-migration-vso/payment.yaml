apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-schema-migration-vault
  namespace: pawbridge
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: payment-schema-migration
  namespace: pawbridge
spec:
  vaultConnectionRef: schema-migration-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: payment-schema-migration-read
    serviceAccount: payment-schema-migration-vault
    audiences: [vault]
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payment-schema-migration
  namespace: pawbridge
spec:
  vaultAuthRef: payment-schema-migration
  mount: secret
  type: kv-v2
  path: pawbridge/dev/payment/schema-migration
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    overwrite: false
    name: payment-schema-migration
    transformation:
      excludeRaw: true
      includes: ["^password$"]
