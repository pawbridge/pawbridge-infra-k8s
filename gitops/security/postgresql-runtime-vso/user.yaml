apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-postgresql-vault-auth
  namespace: pawbridge
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: user-postgresql-vault-auth
  namespace: pawbridge
spec:
  vaultConnectionRef: postgresql-runtime-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: user-postgresql-read
    serviceAccount: user-postgresql-vault-auth
    audiences:
    - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: user-postgresql-auth
  namespace: pawbridge
spec:
  vaultAuthRef: user-postgresql-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/user/postgresql
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    name: user-postgresql-auth
    create: true
    overwrite: false
    transformation:
      excludeRaw: true
      includes:
      - ^postgres-password$
