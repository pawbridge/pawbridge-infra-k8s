apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-runtime-vault-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: payment-runtime-vault-connection
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  address: https://vault.vault.svc.cluster.local:8200
  caCertSecretRef: vault-internal-ca
  skipTLSVerify: false
  tlsServerName: vault.vault.svc.cluster.local
  timeout: 10s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: payment-runtime-vault-auth
  namespace: pawbridge
spec:
  vaultConnectionRef: payment-runtime-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: payment-runtime-read
    serviceAccount: payment-runtime-vault-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payment-mysql-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: payment-runtime-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/payment/mysql
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: payment-service
  destination:
    create: true
    overwrite: false
    name: payment-mysql-auth
    transformation:
      excludeRaw: true
      includes:
        - ^mysql-password$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payment-runtime-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: payment-runtime-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/payment/runtime
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: payment-service
  destination:
    create: true
    overwrite: false
    name: payment-runtime-auth
    transformation:
      excludeRaw: true
      includes:
        - ^TOSS_SECRET_KEY$
