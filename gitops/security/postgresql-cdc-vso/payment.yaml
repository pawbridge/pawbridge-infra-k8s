apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-postgresql-cdc-vault-auth
  namespace: kafka
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: payment-postgresql-cdc-vault-auth
  namespace: kafka
spec:
  vaultConnectionRef: postgresql-cdc-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: payment-postgresql-cdc-read
    serviceAccount: payment-postgresql-cdc-vault-auth
    audiences:
    - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: payment-postgresql-cdc-auth
  namespace: kafka
spec:
  vaultAuthRef: payment-postgresql-cdc-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/payment/postgresql-cdc
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    name: payment-postgresql-cdc-auth
    create: true
    overwrite: false
    transformation:
      excludeRaw: true
      includes:
      - ^username$
      - ^password$
