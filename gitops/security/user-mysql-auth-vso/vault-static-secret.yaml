apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: user-mysql-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: user-mysql-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/user/mysql
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: user-service
  destination:
    create: true
    overwrite: false
    name: user-mysql-auth
    transformation:
      excludeRaw: true
      includes:
        - ^mysql-password$
