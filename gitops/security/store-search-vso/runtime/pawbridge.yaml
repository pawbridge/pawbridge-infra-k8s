apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-search-pawbridge-vault-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: store-search-pawbridge-vault-connection
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  address: https://vault.vault.svc.cluster.local:8200
  caCertSecretRef: vault-internal-ca
  skipTLSVerify: false
  tlsServerName: vault.vault.svc.cluster.local
  timeout: 10s
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: store-search-pawbridge-vault-auth
  namespace: pawbridge
spec:
  vaultConnectionRef: store-search-pawbridge-vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: store-search-pawbridge-read
    serviceAccount: store-search-pawbridge-vault-auth
    audiences:
      - vault
    tokenExpirationSeconds: 600
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: store-search-reader-auth
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: store-search-pawbridge-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/store/elasticsearch/reader
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: store-service
  destination:
    create: true
    overwrite: false
    name: store-search-reader-auth
    type: kubernetes.io/basic-auth
    transformation:
      excludeRaw: true
      includes:
        - ^username$
        - ^password$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: store-search-http-ca
  namespace: pawbridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  vaultAuthRef: store-search-pawbridge-vault-auth
  mount: secret
  type: kv-v2
  path: pawbridge/dev/store/elasticsearch/trust
  refreshAfter: 1m
  hmacSecretData: true
  rolloutRestartTargets:
    - kind: Deployment
      name: store-service
  destination:
    create: true
    overwrite: false
    name: store-search-http-ca
    transformation:
      excludeRaw: true
      includes:
        - ^ca[.]crt$
