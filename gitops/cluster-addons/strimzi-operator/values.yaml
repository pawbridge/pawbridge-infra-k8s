replicas: 1

watchNamespaces:
  - kafka
watchAnyNamespace: false

image:
  digest: sha256:9c32dfe22d8602f43e8d8780706fbf65f023bcde3cef272688f35d1eead2640f
  imagePullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

podDisruptionBudget:
  enabled: false

operatorNetworkPolicy:
  enabled: false

dashboards:
  enabled: false

createAggregateRoles: false
generateNetworkPolicy: true
generatePodDisruptionBudget: true
