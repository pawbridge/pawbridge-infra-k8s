name: Kafka Connect Plugin Image

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/kafka-connect-plugin-image.yml
      - gitops/stateful/kafka-connect/image/**
  push:
    branches:
      - dev
    paths:
      - .github/workflows/kafka-connect-plugin-image.yml
      - gitops/stateful/kafka-connect/image/**
permissions:
  contents: read

concurrency:
  group: kafka-connect-plugin-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Kafka Connect plugin image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: gitops/stateful/kafka-connect/image
          file: gitops/stateful/kafka-connect/image/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: docker.io/dorosiya/pawbridge-debezium-connect:sha-${{ github.sha }}
          cache-from: type=gha,scope=kafka-connect-plugin-image
          cache-to: type=gha,mode=max,scope=kafka-connect-plugin-image
          provenance: mode=max
          sbom: true

      - name: Record immutable image output
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "${IMAGE_DIGEST}"
          {
            echo '### Kafka Connect plugin image'
            echo
            echo '`docker.io/dorosiya/pawbridge-debezium-connect@'"${IMAGE_DIGEST}"'`'
          } >> "${GITHUB_STEP_SUMMARY}"
