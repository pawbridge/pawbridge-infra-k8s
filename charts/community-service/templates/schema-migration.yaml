{{- if .Values.schemaMigration.enabled }}
{{- if ne .Release.Namespace "pawbridge" }}{{ fail "schema migration requires pawbridge namespace" }}{{ end }}
{{- if not .Values.schemaMigration.existingSchemaVerified }}{{ fail "schema baseline/equivalence review is required" }}{{ end }}
{{- if not .Values.schemaMigration.recoveryReference }}{{ fail "recovery drill evidence reference is required" }}{{ end }}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" .Values.schemaMigration.image) }}{{ fail "migration image must use an immutable sha256 digest" }}{{ end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}{{ fail "API image must use an immutable digest" }}{{ end }}
{{- if ne .Values.schemaMigration.apiImageDigest .Values.image.digest }}{{ fail "migration/API image pair must be reviewed together" }}{{ end }}
{{- if not (regexMatch "^[a-f0-9]{40}$" (.Values.schemaMigration.sourceRevision | default "")) }}{{ fail "migration source revision must be a full commit SHA" }}{{ end }}
{{- if ne .Values.image.tag (printf "sha-%s" .Values.schemaMigration.sourceRevision) }}{{ fail "migration/API source revision must match" }}{{ end }}
{{- if ne (get .Values.env "SPRING_JPA_HIBERNATE_DDL_AUTO") "validate" }}{{ fail "Hibernate must use validate before migration activation" }}{{ end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-schema-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    # Existing read-only PreSync checks (wave 0) must pass before changing the DB.
    argocd.argoproj.io/sync-wave: "10"
    # Retain failed Jobs. Do NOT add BeforeHookCreation, HookFailed or a TTL.
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    pawbridge.kr/recovery-reference: {{ .Values.schemaMigration.recoveryReference | quote }}
    pawbridge.kr/source-revision: {{ .Values.schemaMigration.sourceRevision | quote }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: community-schema-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.schemaMigration.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["java"]
          args: ["-XX:MaxRAMPercentage=60", "-cp", "/opt/migration/lib/*", "com.pawbridge.communityservice.migration.CommunitySchemaMigration", "migrate"]
          env:
            - name: COMMUNITY_MIGRATION_JDBC_URL
              value: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_community
            - name: COMMUNITY_MIGRATION_CONFIRM_TARGET
              value: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_community
            - name: COMMUNITY_MIGRATION_USERNAME
              value: pawbridge_community_migrator
            - name: COMMUNITY_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: community-schema-migration
                  key: password
                  optional: false
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- end }}
