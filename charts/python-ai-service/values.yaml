replicaCount: 1
nodeSelector: {}

image:
  repository: dorosiya/pawbridge-python-ai-service
  tag: k8s-v1
  # Production cutovers should pin an immutable digest. When set, digest wins over tag.
  digest: ""
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

env:
  ES_URL: http://elasticsearch-master.databases.svc.cluster.local:9200

secretRef: python-ai-service-secrets
secretRefOptional: true
internalApiSecretRef: ""
elasticsearchSecretRef: ""
elasticsearchCaSecretRef: ""
elasticsearchCaMountPath: /etc/pawbridge/python-search-ca

# Source dev keeps the chart's historical behavior. Target pilots disable this
# because the service does not call the Kubernetes API.
automountServiceAccountToken: true

startupProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3
