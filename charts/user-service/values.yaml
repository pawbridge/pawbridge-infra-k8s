# Default values for user-service
replicaCount: 1

image:
  repository: pawbridge/user-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# 환경변수
env:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pawbridge_user
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ""
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ANIMAL_SERVICE_URL: http://animal-service:8081
  STORE_SERVICE_URL: http://store-service:8083

# Secret 참조 (민감정보)
secretRef: user-service-secrets

# Probe 설정
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
