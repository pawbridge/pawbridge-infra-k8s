# Default values for user-service
replicaCount: 1

image:
  repository: dorosiya/pawbridge-user-service
  tag: k8s-v1
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 300m
    memory: 350Mi
  limits:
    cpu: 1000m
    memory: 768Mi

# 환경변수 (K8s FQDN 사용)
env:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_user
  SPRING_DATASOURCE_USERNAME: root

  REDIS_HOST: redis-master.databases.svc.cluster.local
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

# Secret 참조 (민감정보)
secretRef: user-service-secrets
redisSecretRef: ""

# Probe 설정
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 3

# HPA 설정
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70 # 70% 넘으면 확장
  # targetMemoryUtilizationPercentage: 80 # CPU가 더 정확
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 
    scaleUp:
      stabilizationWindowSeconds: 0
