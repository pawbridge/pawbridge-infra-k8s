worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_conn_zone $server_port zone=gpu:32k;
  limit_conn_zone $server_port zone=recommendation:32k;
  upstream gpu { server unix:/run/pawbridge-gpu/search.sock; }
  server {
    listen 8000;
    client_max_body_size 6m;
    client_body_timeout 15s;
    location = /livez { return 200 'ok'; }
    location = /health {
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_pass http://gpu;
    }
    location = /internal/animals/lost-candidates {
      limit_except POST { deny all; }
      limit_conn gpu 2;
      limit_conn_status 503;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 3s;
      proxy_send_timeout 15s;
      proxy_read_timeout 50s;
      proxy_next_upstream off;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header X-User-Id "";
      proxy_pass http://gpu;
    }
    # Database-only recommendation; keep its admission budget separate from GPU inference.
    location ~ ^/internal/animals/[1-9][0-9]*/similar$ {
      if ($request_method != GET) {
        add_header Allow "GET" always;
        return 405;
      }
      # Existing vector pool: 2 connections + 4 bounded waiters.
      limit_conn recommendation 6;
      limit_conn_status 503;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 3s;
      proxy_send_timeout 5s;
      proxy_read_timeout 20s;
      proxy_next_upstream off;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header X-User-Id "";
      proxy_pass http://gpu;
    }
    location / { return 404; }
  }
}
