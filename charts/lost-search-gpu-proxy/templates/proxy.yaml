apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  nginx.conf: |
{{ .Files.Get "nginx.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      annotations:
        checksum/config: {{ .Files.Get "nginx.conf" | sha256sum }}
      labels: {app: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName | quote }}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          command: [nginx, -c, /etc/pawbridge/nginx.conf, -g, 'daemon off;']
          ports: [{name: http, containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/pawbridge, readOnly: true}
            - {name: socket, mountPath: /run/pawbridge-gpu, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}}
        - name: socket
          hostPath: {path: {{ .Values.socketDirectory | quote }}, type: Directory}
        - name: temporary
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: animal-service}
      ports: [{protocol: TCP, port: 8000}]
  egress: []
