# Default values for store-service
replicaCount: 1

image:
  repository: dorosiya/pawbridge-store-service
  tag: k8s-v1
  # Production cutovers should pin an immutable digest. When set, digest wins over tag.
  digest: ""
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8083

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 300m
    memory: 350Mi
  limits:
    cpu: 1000m
    memory: 768Mi
# 환경변수 (K8s FQDN 사용)
env:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_store
  SPRING_DATASOURCE_USERNAME: root

  KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  R2_ENDPOINT: https://3e28b8ba8375b9010f6a426c1cb9755f.r2.cloudflarestorage.com
  R2_BUCKET_NAME: pawbridge-public-images
  R2_PUBLIC_BASE_URL: https://images.pawbridge.kr
  R2_REGION: auto

secretRef: store-service-secrets
r2SecretRef: store-service-r2-secrets
redisSecretRef: ""
mysqlSecretRef: ""
elasticsearchSecretRef: ""
elasticsearchCaSecretRef: ""
elasticsearchCaMountPath: /etc/pawbridge/elasticsearch
searchPreflight:
  enabled: false
  image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5@sha256:8870d5b7b86235fa790c9112464f5fd3b693f89d73e757a630f8b5cda350f95b
  index: store-products-read
  expectedContract: store-products-v1

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8083
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8083
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8083
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 3

# HPA 설정
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70 # 70% 넘으면 확장
  # targetMemoryUtilizationPercentage: 80 # CPU가 더 정확
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
