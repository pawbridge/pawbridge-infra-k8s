# Default values for store-service
replicaCount: 1

image:
  repository: dorosiya/pawbridge-store-service
  tag: k8s-v1
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8083

resources:
  requests:
    cpu: 300m
    memory: 350Mi
  limits:
    cpu: 1000m
    memory: 768Mi
# 환경변수 (K8s FQDN 사용)
env:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_store
  SPRING_DATASOURCE_USERNAME: root

  KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092
  SPRING_ZIPKIN_BASE_URL: http://zipkin.tracing.svc.cluster.local:9411

secretRef: store-service-secrets

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8083
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8083
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8083
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 3

# HPA 설정
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70 # 70% 넘으면 확장
  # targetMemoryUtilizationPercentage: 80 # CPU가 더 정확
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
