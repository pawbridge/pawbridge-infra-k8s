apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.redisSecretRef }}
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redisSecretRef }}
                  key: redis-password
            {{- end }}
            {{- if .Values.mysqlSecretRef }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysqlSecretRef }}
                  key: mysql-password
            {{- end }}
            {{- if .Values.elasticsearchSecretRef }}
            - name: SPRING_ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearchSecretRef }}
                  key: username
            - name: SPRING_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearchSecretRef }}
                  key: password
            - name: SPRING_SSL_BUNDLE_PEM_STORESEARCH_TRUSTSTORE_CERTIFICATE
              value: {{ printf "%s/ca.crt" .Values.elasticsearchCaMountPath | quote }}
            - name: SPRING_ELASTICSEARCH_RESTCLIENT_SSL_BUNDLE
              value: storesearch
            {{- end }}
            # Legacy store-service-secrets may still expose Spring Cloud AWS
            # properties. Explicit env entries take precedence over envFrom.
            - name: SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.r2SecretRef }}
                  key: R2_ACCESS_KEY_ID
            - name: SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.r2SecretRef }}
                  key: R2_SECRET_ACCESS_KEY
            - name: SPRING_CLOUD_AWS_REGION_STATIC
              value: {{ .Values.env.R2_REGION | quote }}
            - name: SPRING_CLOUD_AWS_S3_ENDPOINT
              value: {{ .Values.env.R2_ENDPOINT | quote }}
            - name: SPRING_CLOUD_AWS_S3_BUCKET
              value: {{ .Values.env.R2_BUCKET_NAME | quote }}
            - name: PAWBRIDGE_STORAGE_PUBLIC_BASE_URL
              value: {{ .Values.env.R2_PUBLIC_BASE_URL | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef }}
                optional: true
            - secretRef:
                name: {{ .Values.r2SecretRef }}
                optional: false
          {{- if .Values.elasticsearchCaSecretRef }}
          volumeMounts:
            - name: store-search-http-ca
              mountPath: {{ .Values.elasticsearchCaMountPath | quote }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
      {{- if .Values.elasticsearchCaSecretRef }}
      volumes:
        - name: store-search-http-ca
          secret:
            secretName: {{ .Values.elasticsearchCaSecretRef }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
