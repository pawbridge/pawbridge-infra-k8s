apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Legacy store-service-secrets may still expose Spring Cloud AWS
            # properties. Explicit env entries take precedence over envFrom.
            - name: SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.r2SecretRef }}
                  key: R2_ACCESS_KEY_ID
            - name: SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.r2SecretRef }}
                  key: R2_SECRET_ACCESS_KEY
            - name: SPRING_CLOUD_AWS_REGION_STATIC
              value: {{ .Values.env.R2_REGION | quote }}
            - name: SPRING_CLOUD_AWS_S3_ENDPOINT
              value: {{ .Values.env.R2_ENDPOINT | quote }}
            - name: SPRING_CLOUD_AWS_S3_BUCKET
              value: {{ .Values.env.R2_BUCKET_NAME | quote }}
            - name: PAWBRIDGE_STORAGE_PUBLIC_BASE_URL
              value: {{ .Values.env.R2_PUBLIC_BASE_URL | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef }}
                optional: true
            - secretRef:
                name: {{ .Values.r2SecretRef }}
                optional: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
