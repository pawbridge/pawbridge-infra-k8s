# Default values for api-gateway
replicaCount: 1

image:
  repository: dorosiya/pawbridge-api-gateway
  tag: k8s-v1
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: api.pawbridge.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 250m
    memory: 300Mi
  limits:
    cpu: 1000m
    memory: 600Mi

# 환경변수 - 다른 서비스 URL (K8s FQDN 사용)
env:
  USER_SERVICE_URL: http://user-service.pawbridge.svc.cluster.local:8080
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  COMMUNITY_SERVICE_URL: http://community-service.pawbridge.svc.cluster.local:8082
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083
  PAYMENT_SERVICE_URL: http://payment-service.pawbridge.svc.cluster.local:8084
  # Zipkin
  SPRING_ZIPKIN_BASE_URL: http://zipkin.tracing.svc.cluster.local:9411

# Secret 참조 (민감정보)
secretRef: api-gateway-secrets

# Probe 설정
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30  # 30 * 5 = 150초까지 대기

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 3

# HPA 설정
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65 # 앞단이라 좀 더 낮게 설정
  #targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
