{{- include "animal-service.postgresqlContract" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $value := .Values.env }}
            {{- if ne $value nil }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.redisSecretRef }}
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redisSecretRef }}
                  key: redis-password
            {{- end }}
            {{- if .Values.postgresqlSecretRef }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresqlSecretRef }}
                  key: postgres-password
            {{- end }}
            {{- if .Values.mysqlSecretRef }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mysqlSecretRef }}
                  key: mysql-password
            {{- end }}
            {{- if .Values.internalApiSecretRef }}
            - name: PYTHON_AI_SERVICE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.internalApiSecretRef }}
                  key: INTERNAL_API_KEY
            {{- end }}
            {{- if .Values.photoOptimizerSecretRef }}
            - name: APMS_PHOTO_OPTIMIZER_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.photoOptimizerSecretRef }}
                  key: INTERNAL_API_KEY
                  optional: false
            {{- end }}
            {{- if .Values.photoArchiveSecretRef }}
            - name: APMS_PHOTO_ARCHIVE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.photoArchiveSecretRef }}
                  key: R2_ACCESS_KEY_ID
                  optional: false
            - name: APMS_PHOTO_ARCHIVE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.photoArchiveSecretRef }}
                  key: R2_SECRET_ACCESS_KEY
                  optional: false
            {{- end }}
            {{- if .Values.lostGalleryFeed.enabled }}
            - name: LOST_GALLERY_FEED_ENABLED
              value: "true"
            - name: LOST_GALLERY_FEED_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "lostGalleryFeed.internalApiSecretRef is required when enabled" .Values.lostGalleryFeed.internalApiSecretRef | quote }}
                  key: LOST_GALLERY_FEED_INTERNAL_API_KEY
                  optional: false
            - name: LOST_GALLERY_FEED_STORAGE_ENDPOINT
              value: {{ required "lostGalleryFeed.storageEndpoint is required when enabled" .Values.lostGalleryFeed.storageEndpoint | quote }}
            - name: LOST_GALLERY_FEED_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "lostGalleryFeed.storageSecretRef is required when enabled" .Values.lostGalleryFeed.storageSecretRef | quote }}
                  key: R2_ACCESS_KEY_ID
                  optional: false
            - name: LOST_GALLERY_FEED_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lostGalleryFeed.storageSecretRef | quote }}
                  key: R2_SECRET_ACCESS_KEY
                  optional: false
            {{- end }}
            {{- if .Values.elasticsearchSecretRef }}
            - name: SPRING_ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearchSecretRef }}
                  key: username
            - name: SPRING_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.elasticsearchSecretRef }}
                  key: password
            - name: SPRING_SSL_BUNDLE_PEM_ANIMALSEARCH_TRUSTSTORE_CERTIFICATE
              value: {{ printf "%s/ca.crt" .Values.elasticsearchCaMountPath | quote }}
            - name: SPRING_ELASTICSEARCH_RESTCLIENT_SSL_BUNDLE
              value: animalsearch
            {{- end }}
          {{- if or .Values.secretRef .Values.r2SecretRef }}
          envFrom:
            {{- if .Values.secretRef }}
            - secretRef:
                name: {{ .Values.secretRef }}
                optional: {{ .Values.secretRefOptional }}
            {{- end }}
            {{- if .Values.r2SecretRef }}
            - secretRef:
                name: {{ .Values.r2SecretRef }}
                optional: false
            {{- end }}
          {{- end }}
          {{- if .Values.elasticsearchCaSecretRef }}
          volumeMounts:
            - name: animal-search-http-ca
              mountPath: {{ .Values.elasticsearchCaMountPath | quote }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
      {{- if .Values.elasticsearchCaSecretRef }}
      volumes:
        - name: animal-search-http-ca
          secret:
            secretName: {{ .Values.elasticsearchCaSecretRef }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
