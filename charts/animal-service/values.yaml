# Default values for animal-service
replicaCount: 1

# Disabled until baseline, restore drill, credentials and image provenance are approved.
schemaMigration:
  enabled: false
  image: ""
  apiImageDigest: ""
  sourceRevision: ""
  recoveryReference: ""
  existingSchemaVerified: false
nodeSelector: {}
affinity: {}

image:
  repository: dorosiya/pawbridge-animal-service
  tag: k8s-v1
  # Production cutovers should pin an immutable digest. When set, digest wins over tag.
  digest: ""
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 300m
    memory: 350Mi
  limits:
    cpu: 1000m
    memory: 768Mi
# 환경변수 (K8s FQDN 사용)
env:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_animal?rewriteBatchedStatements=true
  SPRING_DATASOURCE_USERNAME: root

  KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092
  SPRING_ELASTICSEARCH_URIS: http://elasticsearch-master.databases.svc.cluster.local:9200
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

secretRef: animal-service-secrets
secretRefOptional: true
redisSecretRef: ""
mysqlSecretRef: ""
r2SecretRef: ""
internalApiSecretRef: ""
elasticsearchSecretRef: ""
elasticsearchCaSecretRef: ""
elasticsearchCaMountPath: /etc/pawbridge/animal-search-ca

# Source dev keeps the chart's historical behavior. Target pilots disable this
# because the service does not call the Kubernetes API.
automountServiceAccountToken: true

serviceMonitor:
  enabled: true

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 3

# CronJob 설정 (배치 스케줄)
cronjob:
  enabled: true
  # Keep the trigger declared but held until its backend image and first run
  # have passed the separately controlled operational gate.
  suspend: true
  schedule: "*/30 * * * *"
  timeZone: Asia/Seoul
  image: curlimages/curl:8.5.0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# HPA 설정
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70 # 70% 넘으면 확장
  # targetMemoryUtilizationPercentage: 80 # CPU가 더 정확
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
