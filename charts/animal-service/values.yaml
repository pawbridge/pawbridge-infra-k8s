# Default values for animal-service
replicaCount: 1

image:
  repository: pawbridge/animal-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pawbridge_animal
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ""
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: "9200"

secretRef: animal-service-secrets

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 5
