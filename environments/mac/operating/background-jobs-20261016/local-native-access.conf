pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
stream {
 resolver 127.0.0.11 valid=10s;
 server { listen 5432; set $pg postgres:5432; proxy_connect_timeout 5s; proxy_timeout 300s; proxy_pass $pg; }
}
http {
 resolver 127.0.0.11 valid=10s;
 access_log off;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  client_max_body_size 16k;
  location ~ "^/internal/animals/lost-gallery/snapshots(?:/[a-f0-9]{32}(?:/pages)?)?$" {
   set $animal http://animal-service:8081;
   proxy_pass $animal;
   proxy_read_timeout 140s;
   proxy_set_header Host $host;
  }
  location / { return 404; }
 }
}
