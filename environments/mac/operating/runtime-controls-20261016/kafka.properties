# New isolated KRaft cluster. Candidate Kafka 4.1.x contract, not Windows live proof.
process.roles=broker,controller
node.id=1
controller.listener.names=CONTROLLER
listeners=INTERNAL://:9092,CONTROLLER://:9093
advertised.listeners=INTERNAL://kafka:9092
listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.quorum.bootstrap.servers=localhost:9093
log.dirs=/var/lib/kafka/data
num.partitions=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1
auto.create.topics.enable=false
# Explicit topic policies are in topics.json; do not substitute dev's 24h/256MiB.
log.retention.hours=168
log.segment.bytes=67108864
