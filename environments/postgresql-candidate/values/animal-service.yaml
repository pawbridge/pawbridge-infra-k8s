replicaCount: 0
image:
  digest: ''
mysqlSecretRef: ''
postgresqlSecretRef: animal-postgresql-auth
elasticsearchSecretRef: ''
elasticsearchCaSecretRef: ''
autoscaling:
  enabled: false
env:
  SPRING_PROFILES_ACTIVE: dev,postgresql
  SPRING_DATASOURCE_URL: jdbc:postgresql://pawbridge-postgresql.databases.svc.cluster.local:5432/pawbridge
  SPRING_DATASOURCE_USERNAME: pawbridge_animal_app
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_DATASOURCE_HIKARI_SCHEMA: pawbridge_animal
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '10'
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '2'
  SPRING_DATASOURCE_HIKARI_CONNECTION_INIT_SQL: SET TIME ZONE 'UTC'
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: pawbridge_animal
  SPRING_JPA_OPEN_IN_VIEW: 'false'
  SPRING_SQL_INIT_MODE: never
  SPRING_ELASTICSEARCH_URIS: null
  SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: never
  SPRING_BATCH_JOB_ENABLED: 'false'
  PAWBRIDGE_ANIMALQUERY_BACKEND: postgresql
  PAWBRIDGE_RECOMMENDATION_BACKEND: postgresql
cronjob:
  enabled: false

# Existing dev Jobs launch the MySQL runner; PG schema preparation is separate.
schemaMigration:
  enabled: false
