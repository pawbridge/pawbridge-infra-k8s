replicaCount: 0
image:
  digest: ''
mysqlSecretRef: ''
postgresqlSecretRef: payment-postgresql-auth
elasticsearchSecretRef: ''
elasticsearchCaSecretRef: ''
autoscaling:
  enabled: false
env:
  SPRING_PROFILES_ACTIVE: dev,postgresql
  SPRING_DATASOURCE_URL: jdbc:postgresql://pawbridge-postgresql.databases.svc.cluster.local:5432/pawbridge
  SPRING_DATASOURCE_USERNAME: pawbridge_payment_app
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_DATASOURCE_HIKARI_SCHEMA: pawbridge_payment
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: '5'
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: '0'
  SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET TIME ZONE 'UTC'
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: pawbridge_payment
  SPRING_JPA_OPEN_IN_VIEW: 'false'
  SPRING_SQL_INIT_MODE: never
  SPRING_ELASTICSEARCH_URIS: null

# Existing dev Jobs launch the MySQL runner; PG schema preparation is separate.
schemaMigration:
  enabled: false
