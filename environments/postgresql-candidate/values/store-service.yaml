replicaCount: 0
image:
  digest: ''
mysqlSecretRef: ''
postgresqlSecretRef: store-postgresql-auth
elasticsearchSecretRef: ''
elasticsearchCaSecretRef: ''
autoscaling:
  enabled: false
env:
  SPRING_PROFILES_ACTIVE: dev,postgresql
  SPRING_DATASOURCE_URL: jdbc:postgresql://pawbridge-postgresql.databases.svc.cluster.local:5432/pawbridge
  SPRING_DATASOURCE_USERNAME: pawbridge_store_app
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_DATASOURCE_HIKARI_SCHEMA: pawbridge_store
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
  SPRING_DATASOURCE_HIKARI_CONNECTION_INIT_SQL: SET TIME ZONE 'UTC'
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: pawbridge_store
  SPRING_JPA_OPEN_IN_VIEW: 'false'
  SPRING_SQL_INIT_MODE: never
  SPRING_ELASTICSEARCH_URIS: null
  PAWBRIDGE_SEARCH_BACKEND: postgresql
searchPreflight:
  enabled: false

# Existing dev Jobs launch the MySQL runner; PG schema preparation is separate.
schemaMigration:
  enabled: false
