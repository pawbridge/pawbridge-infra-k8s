apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dev-connect-configs
  namespace: pawbridge-dev
  labels:
    strimzi.io/cluster: pawbridge-dev
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dev-connect-offsets
  namespace: pawbridge-dev
  labels:
    strimzi.io/cluster: pawbridge-dev
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  partitions: 25
  replicas: 1
  config:
    cleanup.policy: compact
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dev-connect-status
  namespace: pawbridge-dev
  labels:
    strimzi.io/cluster: pawbridge-dev
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  partitions: 5
  replicas: 1
  config:
    cleanup.policy: compact
