replicaCount: 1

image:
  repository: dorosiya/pawbridge-payment-service
  tag: sha-e44a50b847c4edc95cbd5b9b0bb6d7c93fee6ed1
  digest: sha256:9f9b891c085c5d9dd00aea945d89db7fa455c8d699e0ba9696429eebc32bb6cf
  # Temporary bootstrap provenance; CI replaces this with the built immutable digest.
  pullPolicy: IfNotPresent

automountServiceAccountToken: false
secretRef: payment-runtime-auth
secretRefOptional: false
mysqlSecretRef: payment-mysql-auth
nodeSelector:
  kubernetes.io/hostname: pawbridge-k136-w2

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

env:
  # Force Dev Profile
  SPRING_PROFILES_ACTIVE: dev

  # Validate the restored schema; never create or alter payment tables at startup.
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_SQL_INIT_MODE: never
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

  # 1. Database
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_payment
  SPRING_DATASOURCE_USERNAME: pawbridge_payment_app

  # 2. Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092

  # 3. Zipkin
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  # 4. Service Discovery
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083

  # Payment has no Redis consumer. Keep internal health details private.
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
