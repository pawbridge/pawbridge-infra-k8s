replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: pawbridge-k136-w2

image:
  repository: dorosiya/pawbridge-community-service
  tag: sha-13dce81c8767e5f3241d58af15efd30b7fc4a6a9
  digest: sha256:3c91076216efdd926d7db98129fce4cb5c35581e326986411cbfa0c56196b2d0
  # Temporary bootstrap provenance; CI replaces this with the built immutable digest.
  pullPolicy: IfNotPresent

automountServiceAccountToken: false
secretRefOptional: true
mysqlSecretRef: community-mysql-auth
r2SecretRef: community-service-r2-secrets-vso
r2SecretRefOptional: false
elasticsearchSecretRef: community-search-writer-auth
elasticsearchCaSecretRef: community-search-http-ca

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

env:
  # Force Dev Profile
  SPRING_PROFILES_ACTIVE: dev

  # JPA Settings (테이블 자동 생성)
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

  # 1. Database
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_community
  SPRING_DATASOURCE_USERNAME: pawbridge_community_app

  # 2. Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092

  # 3. Elasticsearch
  SPRING_ELASTICSEARCH_URIS: https://store-search-es-http.databases.svc:9200

  # 4. Zipkin
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  # 5. Timezone (KST)
  TZ: "Asia/Seoul"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"

  # 6. Service Discovery
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083
  USER_SERVICE_URL: http://user-service.pawbridge.svc.cluster.local:8080

  # 7. Redis (URL Style)
  SPRING_DATA_REDIS_URL: redis://redis-master.databases.svc.cluster.local:6379

  # 8. Cloudflare R2 public object storage
  R2_ENDPOINT: https://3e28b8ba8375b9010f6a426c1cb9755f.r2.cloudflarestorage.com
  R2_BUCKET_NAME: pawbridge-public-images
  R2_PUBLIC_BASE_URL: https://images.pawbridge.kr
  R2_REGION: auto
