replicaCount: 1

image:
  repository: dorosiya/pawbridge-community-service
  tag: sha-9f0446e9112c73e3ef11502901be71a3d6b80b30
  digest: sha256:26dac657f8fa5f717cf768ff122c42df086af30f34d65cd47a88f3458e71ad9f
  # Temporary bootstrap provenance; CI replaces this with the built immutable digest.
  pullPolicy: IfNotPresent

automountServiceAccountToken: false
secretRefOptional: false

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

env:
  # Force Dev Profile
  SPRING_PROFILES_ACTIVE: dev

  # JPA Settings (테이블 자동 생성)
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

  # 1. Database
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_community

  # 2. Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092

  # 3. Elasticsearch
  SPRING_ELASTICSEARCH_URIS: http://elasticsearch-master.databases.svc.cluster.local:9200

  # 4. Zipkin
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  # 5. Service Discovery
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083
  USER_SERVICE_URL: http://user-service.pawbridge.svc.cluster.local:8080

  # 6. Redis (URL Style)
  SPRING_DATA_REDIS_URL: redis://redis-master.databases.svc.cluster.local:6379
