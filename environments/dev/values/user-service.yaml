replicaCount: 1

image:
  repository: dorosiya/pawbridge-user-service
  tag: sha-f9bb4fffae43e88dcc5a6e5769679433a2f3050a
  digest: sha256:e988ab39e411045d2afa3d7cbd47f70e32c4887bee61846605cd2d5fc583dfab
  # Temporary bootstrap provenance; CI replaces this with the built immutable digest.
  pullPolicy: IfNotPresent

automountServiceAccountToken: false
secretRefOptional: false

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

redisSecretRef: redis-auth

env:
  # Force Dev Profile
  SPRING_PROFILES_ACTIVE: dev

  # JPA Settings (테이블 자동 생성)
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

  # 1. Database
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_user

  # 2. Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092

  # 3. Zipkin
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  # 4. Service Discovery
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083

  # 6. Redis (Explicit Host/Port for Spring Data Redis)
  REDIS_HOST: redis-master.databases.svc.cluster.local
  REDIS_PORT: "6379"
