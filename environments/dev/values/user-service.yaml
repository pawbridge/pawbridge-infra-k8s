replicaCount: 1

image:
  repository: dorosiya/pawbridge-user-service
  tag: sha-cbb97c683fb14c41870ce4c7a4a328e5062a1e58
  digest: sha256:bc2d6b3938df850add928b8cb9021c2ff35d7c5cf8c6a3167e43ec24c774bc18
  # Temporary bootstrap provenance; CI replaces this with the built immutable digest.
  pullPolicy: IfNotPresent

automountServiceAccountToken: false
secretRef: user-google-auth
secretRefOptional: false
mysqlSecretRef: user-mysql-auth
jwtSecretRef: user-jwt-auth

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

redisSecretRef: redis-auth

env:
  # Force Dev Profile
  SPRING_PROFILES_ACTIVE: dev

  # JPA: Flyway manages DDL; Hibernate validates only.
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

  # 1. Database
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_user
  SPRING_DATASOURCE_USERNAME: pawbridge_user_app

  # 2. Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092

  # 3. Zipkin
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  # 4. Timezone (KST)
  TZ: "Asia/Seoul"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"

  # 5. Service Discovery
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083

  # 6. Redis (Explicit Host/Port for Spring Data Redis)
  REDIS_HOST: redis-master.databases.svc.cluster.local
  REDIS_PORT: "6379"

  # 7. JWT lifetime (milliseconds; JWT_SECRET is supplied by Vault)
  JWT_ACCESS_TOKEN_EXPIRATION: "3600000"
  JWT_REFRESH_TOKEN_EXPIRATION: "1209600000"

  # 8. Google OAuth callback and frontend landing URL
  REDIRECT_URI: https://api.pawbridge.kr/login/oauth2/code/google
  OAUTH2_REDIRECT_URI: https://www.pawbridge.kr/oauth/callback

