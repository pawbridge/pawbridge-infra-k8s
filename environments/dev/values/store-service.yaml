nodeSelector: {}
affinity:
  nodeAffinity:
    # Keep business workloads off the control plane; allow either worker.
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [pawbridge-k136-w1, pawbridge-k136-w2]
    # Prefer w1 to relieve w2. This is not live-usage automatic rebalancing.
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [pawbridge-k136-w1]

image:
  repository: dorosiya/pawbridge-store-service
  tag: sha-e7edbed2b9e664fecc4c34e762e17dd9fbe1c8ff
  digest: sha256:96ce0e1b3fb319eebd67ec37995819abfccc69c74e79dbc5e75f966266fa987e

r2SecretRef: store-service-r2-secrets-vso
redisSecretRef: redis-auth
mysqlSecretRef: store-mysql-auth
elasticsearchSecretRef: store-search-reader-auth
elasticsearchCaSecretRef: store-search-http-ca
searchPreflight:
  enabled: true
  index: store-products-read
  expectedContract: store-products-v1

env:
  # Force Dev Profile
  SPRING_PROFILES_ACTIVE: dev

  # JPA Settings (테이블 자동 생성)
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

  # 1. Database
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_store
  SPRING_DATASOURCE_USERNAME: pawbridge_store_app

  # 2. Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092

  # 3. Elasticsearch
  SPRING_ELASTICSEARCH_URIS: https://pawbridge-elasticsearch-es-http.databases.svc:9200
  STORE_PRODUCT_SEARCH_INDEX: store-products-read

  # 4. Zipkin
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  # 5. Timezone (KST)
  TZ: "Asia/Seoul"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"

  # 6. Service Discovery
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083

  # 7. Redis (Explicit Host/Port for Redisson)
  SPRING_DATA_REDIS_HOST: redis-master.databases.svc.cluster.local
  SPRING_DATA_REDIS_PORT: "6379"
