env:
  # Force Dev Profile
  SPRING_PROFILES_ACTIVE: dev

  # 1. Database
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_store

  # 2. Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092

  # 3. Elasticsearch
  SPRING_ELASTICSEARCH_URIS: http://elasticsearch-master.databases.svc.cluster.local:9200

  # 4. Zipkin
  SPRING_ZIPKIN_BASE_URL: http://zipkin.tracing.svc.cluster.local:9411

  # 5. Service Discovery
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083

  # 6. Redis (Explicit Host/Port for Redisson)
  SPRING_DATA_REDIS_URL: redis://redis-master.databases.svc.cluster.local:6379
  REDIS_HOST: redis-master.databases.svc.cluster.local
  REDIS_PORT: "6379"
