replicaCount: 1
nodeSelector: {}
affinity:
  nodeAffinity:
    # Keep application pods on workers; permit w1 when w2 cannot fit a new pod.
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pawbridge-k136-w1
                - pawbridge-k136-w2
    # A scheduling preference, not live-usage balancing or guaranteed placement.
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pawbridge-k136-w2

image:
  repository: dorosiya/pawbridge-animal-service
  tag: sha-cf989411dc0ae8063c06ecd8a4b941a47a8ec857
  digest: sha256:db1228b77cdd5a01a14082b1fcff94cdffbf5c85f3298f2c96a1f0bc232a68ed
  # Temporary bootstrap provenance; CI replaces this with the built immutable digest.
  pullPolicy: IfNotPresent

automountServiceAccountToken: false
secretRefOptional: false
secretRef: animal-runtime-auth
mysqlSecretRef: animal-mysql-auth
r2SecretRef: animal-r2-auth
internalApiSecretRef: animal-python-internal-auth
photoOptimizerSecretRef: animal-python-internal-auth
photoArchiveSecretRef: animal-photo-archive-r2-auth
elasticsearchSecretRef: animal-search-writer-auth
elasticsearchCaSecretRef: animal-search-http-ca

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

cronjob:
  # Resume after the controlled APMS run and identity/vector preservation checks.
  enabled: true
  suspend: false
  timeZone: Asia/Seoul

redisSecretRef: redis-auth

env:
  # Force Dev Profile
  SPRING_PROFILES_ACTIVE: dev

  # JPA — validate: 기동 시 스키마 검증만 (update 시 api_source ALTER 반복·MDL 유발)
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  # Restored Batch tables are required; startup must not create or alter them.
  SPRING_BATCH_JDBC_INITIALIZE_SCHEMA: never
  SPRING_BATCH_JOB_ENABLED: "false"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

  # 1. Database (MySQL)
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql.databases.svc.cluster.local:3306/pawbridge_animal?rewriteBatchedStatements=true
  SPRING_DATASOURCE_USERNAME: pawbridge_animal_app
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"

  # 2. Kafka (Strimzi)
  SPRING_KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092
  
  # 3. Elasticsearch
  SPRING_ELASTICSEARCH_URIS: https://pawbridge-elasticsearch-es-http.databases.svc:9200

  # 4. Zipkin (Tracing)
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  # 5. Timezone (KST)
  TZ: "Asia/Seoul"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"

  # 6. Service Discovery (Internal URLs)
  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083
  PYTHON_AI_SERVICE_URL: http://python-ai-service.pawbridge.svc.cluster.local:8000

  R2_ENDPOINT: https://3e28b8ba8375b9010f6a426c1cb9755f.r2.cloudflarestorage.com
  R2_REGION: auto
  R2_BUCKET_NAME: pawbridge-public-images
  R2_PUBLIC_BASE_URL: https://images.pawbridge.kr

  # Connect dedicated archive credentials first. Activation requires the isolated-client image.
  APMS_PHOTO_ARCHIVE_ENABLED: "false"
  APMS_PHOTO_ARCHIVE_BUCKET: pawbridge-animal-originals
  APMS_PHOTO_ARCHIVE_ENDPOINT: https://3e28b8ba8375b9010f6a426c1cb9755f.r2.cloudflarestorage.com
  APMS_PHOTO_ARCHIVE_REGION: auto
  APMS_PHOTO_OPTIMIZER_URL: http://photo-service.pawbridge.svc.cluster.local:8000/internal/photos/optimize
  # Per-process budgets; reassess when replicas or restart frequency changes.
  APMS_PHOTO_ARCHIVE_SCAN_SIZE: "5"
  APMS_PHOTO_ARCHIVE_MAX_PHOTOS: "10"
  APMS_PHOTO_ARCHIVE_MAX_RUN_SECONDS: "120"
  APMS_PHOTO_ARCHIVE_LEASE_SECONDS: "600"
  APMS_PHOTO_ARCHIVE_RECHECK_SECONDS: "604800"
  APMS_PHOTO_ARCHIVE_INTERVAL_MS: "900000"
  APMS_PHOTO_ARCHIVE_INITIAL_DELAY_MS: "60000"

  # 7. Redis (Explicit Host/Port for Redisson)
  SPRING_DATA_REDIS_HOST: redis-master.databases.svc.cluster.local
  SPRING_DATA_REDIS_PORT: "6379"

  # 8. Chatbot Rate Limit
  CHATBOT_RATE_LIMIT_ANON_10M: "5"
  CHATBOT_RATE_LIMIT_ANON_DAILY: "20"
  CHATBOT_RATE_LIMIT_IP_10M: "20"
  CHATBOT_RATE_LIMIT_IP_DAILY: "100"
  CHATBOT_RATE_LIMIT_GLOBAL_DAILY: "300"

schemaMigration:
  image: dorosiya/pawbridge-animal-service@sha256:944b0be2b43fe2502d7a1cc787be70d68bf535271dceee7c0da6d90fced1ddc3
