# Independent one-shot client; never joins the application/data network.
name: pawbridge-dev-vault
services:
  vault-agent:
    image: hashicorp/vault@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
    pull_policy: never
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    user: "${PAWBRIDGE_DEV_UID:-1000}:${PAWBRIDGE_DEV_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: [vault]
    command: [agent, -config=/config/agent.hcl]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    volumes:
      - ./:/config:ro
      - ${PAWBRIDGE_DEV_STATE:?Set the private state directory}/vault/ca.crt:/tls/ca.crt:ro
      - ${PAWBRIDGE_DEV_STATE:?Set the private state directory}/vault/credentials:/auth:ro
      - ${PAWBRIDGE_DEV_STATE:?Set the private state directory}/vault/rendered:/output
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "1"}
