replicaCount: 1

env:
  # JPA Settings (테이블 자동 생성)
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"
  # Password injected via Secret

  REDIS_HOST: redis-master.databases.svc.cluster.local
  REDIS_PORT: "6379"

  KAFKA_BOOTSTRAP_SERVERS: pawbridge-kafka-bootstrap.kafka.svc.cluster.local:9092

  ANIMAL_SERVICE_URL: http://animal-service.pawbridge.svc.cluster.local:8081
  STORE_SERVICE_URL: http://store-service.pawbridge.svc.cluster.local:8083
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin.tracing.svc.cluster.local:9411/api/v2/spans

  # Timezone (KST)
  TZ: "Asia/Seoul"
  JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
